<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Email Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-200">
        <!-- Logo Header -->
        <div class="text-center mb-6">
            <span class="text-4xl">✉️</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-2">Servicio de Correos</h1>
            <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales para acceder al panel</p>
        </div>

        <!-- Mensaje de Error -->
        {% if error_message %}
        <div class="mb-4 p-3 bg-red-100 border border-red-200 text-red-700 text-xs font-semibold rounded-lg text-center">
            {{ error_message }}
        </div>
        {% endif %}

        <!-- Formulario de Login -->
        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="Tu usuario"
                       class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors shadow-md mt-2">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Ancla Estudio &copy; 2026
        </div>
    </div>

</body>
</html>
